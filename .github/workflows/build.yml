name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies (Pillow for Icon Generation)
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate Android Project Scaffolding & Icons
        run: |
          python generate_project.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Compatible Gradle Wrapper (Version 8.5)
        run: gradle wrapper --gradle-version 8.5

      - name: Build Debug APK with Gradlew
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamDownloader-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
